name: Altyazi

on:
  workflow_dispatch:
    inputs:
      islem:
        description: "cikar = konuşmayı metne çevir (Whisper) | goster = altyazıları loga yaz | gom = altyazıyı videoya göm | kuyruga = bitmiş videoyu paylaşım kuyruğuna ekle"
        required: true
        type: choice
        options: [cikar, goster, gom, kuyruga]

permissions:
  contents: write

concurrency:
  group: altyazi
  cancel-in-progress: false

jobs:
  altyazi:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Araçlar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-montserrat fonts-dejavu-core
          fc-list | grep -i montserrat | head -n 3 || true
      - name: Whisper kur
        if: inputs.islem == 'cikar'
        run: pip install -q faster-whisper
      - name: Çalıştır
        run: python altyazi.py ${{ inputs.islem }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
