name: Reels paylas

on:
  workflow_dispatch:
    inputs:
      yayin_saati:
        description: "Yayın saati (Türkiye, SS:DD). Boş bırakılırsa video hazır olunca hemen yayınlanır."
        required: false
        default: ""
  schedule:
    # Her gün 19:00 TR yayını. GitHub zamanlayıcısı dakikalarca/saatlerce gecikebildiği ya da
    # atlayabildiği için 17:07 / 17:37 / 18:07 / 18:37 TR (UTC+3) dört tetikleyici var.
    # Ayrıca cron-job.org her gün 18:30 TR'de workflow_dispatch (yayin_saati=19:00) ile tetikler.
    # İlk çalışan videoyu hazırlar ve 19:00'ı bekler; paylas.py aynı gün ikinci kez paylaşmaz.
    - cron: "7 14 * * *"
    - cron: "37 14 * * *"
    - cron: "7 15 * * *"
    - cron: "37 15 * * *"

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: Zamanlayıcıyı canlı tut (GitHub 60 gün işlemsiz depoda zamanlayıcıyı kapatır)
        if: github.event_name == 'schedule'
        run: |
          son=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - son )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u > .canli-tut
            git add .canli-tut
            git commit -m "Zamanlayıcıyı canlı tut"
            git push
          fi
      - name: ffmpeg kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Paylaş
        run: python3 paylas.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Zamanlı tetik (GitHub cron ya da cron-job.org, saat verilmiş) aynı gün ikinci kez paylaşmaz.
          ZAMANLI: ${{ (github.event_name == 'schedule' || inputs.yayin_saati != '') && '1' || '' }}
          YAYIN_SAATI: ${{ github.event_name == 'schedule' && '19:00' || inputs.yayin_saati }}
