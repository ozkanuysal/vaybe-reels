name: Reels paylas

on:
  workflow_dispatch:
    inputs:
      yayin_saati:
        description: "Yayın saati (Türkiye, SS:DD). Boş bırakılırsa video hazır olunca hemen yayınlanır."
        required: false
        default: ""
  schedule:
    # TEST: 10:48 / 10:53 / 10:58 TR tetikler, 10:55'te yayınlar.
    # Gerçek: "0 15 * * *", "20 15 * * *", "40 15 * * *" (18:00/18:20/18:40 TR) ve 19:00.
    # GitHub zamanlayıcısı gecikebildiği/atlayabildiği için birden fazla tetikleyici var;
    # paylas.py aynı gün ikinci kez paylaşmaz.
    - cron: "48 7 * * *"
    - cron: "53 7 * * *"
    - cron: "58 7 * * *"

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Zamanlayıcıyı canlı tut (GitHub 60 gün işlemsiz depoda zamanlayıcıyı kapatır)
        if: github.event_name == 'schedule'
        run: |
          son=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - son )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u > .canli-tut
            git add .canli-tut
            git commit -m "Zamanlayıcıyı canlı tut"
            git push
          fi
      - name: ffmpeg kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Paylaş
        run: python3 paylas.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZAMANLI: ${{ github.event_name == 'schedule' && '1' || '' }}
          YAYIN_SAATI: ${{ github.event_name == 'schedule' && '10:55' || inputs.yayin_saati }}
